services:
  - type: web
    name: prometheus-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 32 --timeout-keep-alive 5
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
