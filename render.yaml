services:
  - type: web
    name: prometheus-api
    runtime: python
    branch: main
    autoDeployTrigger: commit
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 32 --timeout-keep-alive 5
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      # Set false initially; enable in Render after registering the Google project
      # and adding its service-account Secret File. Git syncs preserve this value.
      - key: GEE_ENABLED
        sync: false
      # Accounts: pooled PostgreSQL URL and the first administrator (created once,
      # while no admin exists). Without DATABASE_URL the account routes answer 503.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Copilot: Gemini key from Google AI Studio. Without it the assistant answers 503.
      - key: GEMINI_API_KEY
        sync: false
